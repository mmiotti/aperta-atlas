[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aperta-atlas"
version = "0.3.0"
description = "Opinionated project scaffolding on top of the aperta accessibility-analysis library, plus the projects built on it."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Marco Miotti", email = "marco@miotti.me"},
]
keywords = [
    "accessibility",
    "transport",
    "mobility",
    "urban",
    "pipeline",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

# Lightweight default install: the `aperta_atlas` framework + the algorithm
# library it sits on top of. No heavy data-handling deps — those are
# behind the `projects` extra below.
dependencies = [
    "aperta>=0.4.4a0,<0.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

# Optional features.
#   - `projects`: deps needed to actually RUN the atlas pipeline scripts
#     under src/main, src/survey, src/technical_validation, src/data_paper and
#     the preparation scripts under src/preparation. A user who installs
#     `aperta-atlas` alone (the published package) gets just the
#     `aperta_atlas` scaffolding framework — they can build their own
#     project on top, but won't be able to execute the Aperta Accessibility
#     Atlas pipeline shipped in this repo without this extra. The
#     private `aperta-lumos` sibling repo also depends on this extra
#     (via its own pyproject) since it reuses the same scaffolding.
[project.optional-dependencies]
projects = [
    "aperta[osm,topo,h3]",
    "osmium>=4",            # pyosmium: PBF streaming in preparation/world/osm/*_from_pbf.py
    "pyaxis>=0.4",          # parse BFS PC-Axis (.px) files (Swiss data)
    "python-calamine>=0.2", # read legacy .xls (MTMC 2000 postcode points)
]
# Utility estimation (main/09a, written against the biogeme 3.2 API). Separate
# from `projects` because biogeme 3.2 only installs on Python 3.12 and requires
# pandas < 3; the aperta 0.5 refactor migrates 09a to biogeme 3.3.
estimation = [
    "biogeme>=3.2,<3.3",
    # biogeme 3.2 writes multi-line comments into a new run folder's biogeme.toml, which
    # tomlkit rejects from 0.15.1 on ("Comment cannot contain line breaks").
    "tomlkit<0.15.1",
]
# Dev tooling, mirroring aperta's `[dev]` extra (ruff, mypy, jupytext). Unlike
# aperta, this repo has no `.pre-commit-config.yaml` yet, so `pre-commit` only
# matters once one is added. Install with `pip install -e '.[dev]'`.
dev = [
    "pre-commit>=4.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "jupytext>=1.16",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aperta_atlas*"]
